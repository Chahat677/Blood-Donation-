<!DOCTYPE html>
<html>
<head>
  <title>Blood Donation App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Register as Donor</h2>
  <form id="donorForm">
    <input type="text" id="name" placeholder="Name" required><br>
    <input type="number" id="age" placeholder="Age" required><br>
    <input type="text" id="bloodGroup" placeholder="Blood Group" required><br>
    <input type="text" id="contact" placeholder="Contact Number" required><br>
    <button type="submit">Register</button>
  </form>

  <script>
    const form = document.getElementById('donorForm');
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();

      const donor = {
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        bloodGroup: document.getElementById('bloodGroup').value,
        contact: document.getElementById('contact').value
      };

      try {
        const res = await fetch('http://localhost:5000/register', {  //  backend port
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(donor)
        });
        const data = await res.json();
        alert(data.message);
        form.reset();
      } catch(err) {
        alert("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
